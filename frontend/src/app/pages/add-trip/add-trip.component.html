<div class="page">

    <div class="card">
  
      <h2>Add a New Trip</h2>
  
      <div class="form-group">
        <label>Title</label>
        <input [(ngModel)]="title" placeholder="e.g. Summer in Rome" />
      </div>
  
      <div class="form-group">
        <label>Destination</label>
        <input [(ngModel)]="destination" placeholder="e.g. Italy" />
      </div>
  
      <div class="form-group">
        <label>Image URL</label>
        <input [(ngModel)]="image" placeholder="Paste image link..." />
      </div>
  
      <div class="form-row">
        <div>
          <label>Start Date</label>
          <input type="date" [(ngModel)]="startDate" />
        </div>
  
        <div>
          <label>End Date</label>
          <input type="date" [(ngModel)]="endDate" />
        </div>
      </div>
  
      <button (click)="createTrip()">Create Trip</button>
  
    </div>
  
  </div>
